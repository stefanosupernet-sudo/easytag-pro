<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento ricevuto | Easy Tag</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --blue: #1182DE; --gray-900: #202124; --gray-700: #5F6368; }
    body { font-family: Inter, -apple-system, sans-serif; color: var(--gray-900); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F8F9FA; }
    .card { background: white; border-radius: 16px; padding: 40px 36px; max-width: 440px; text-align: center; box-shadow: 0 4px 24px rgba(17,130,222,0.12); border: 1px solid #E8EAED; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: var(--gray-700); line-height: 1.6; margin: 0 0 24px; font-size: 15px; }
    a { display: inline-block; background: var(--blue); color: white; text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; }
    .sid { font-size: 12px; color: #9AA0A6; margin-top: 20px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Pagamento ricevuto</h1>
    <p>Grazie. A breve riceverai un’email con i file del container GTM o le istruzioni per il pacchetto ore.<br><br>Controlla anche lo spam.</p>
    <a href="/">Torna alla home</a>
    <p class="sid" id="sid"></p>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const id = p.get('session_id');
    if (id) document.getElementById('sid').textContent = 'Rif: ' + id;
  </script>
</body>
</html>
