<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti | Easy Tag</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{--blue:#1182DE;--blue-dark:#0B5CAD;--light:#E8F3FC;--ink:#202124;--gray:#5F6368;--line:#E8EAED;--pale:#F8F9FA}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);line-height:1.65}.header{position:sticky;top:0;z-index:5;background:#fffffff5;border-bottom:1px solid var(--line);padding:0 20px}.header-inner{max-width:1120px;min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:20px;font-weight:700;text-decoration:none;color:inherit}.mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:9px;background:var(--blue);color:white}.nav{display:flex;align-items:center;gap:18px}.nav>a,.nav summary{font-size:14px;font-weight:600;text-decoration:none;color:var(--gray);cursor:pointer}.nav a:hover,.nav a.active,.nav summary:hover{color:var(--blue)}.nav-group{position:relative}.nav-group summary{list-style:none}.nav-group summary::-webkit-details-marker{display:none}.nav-group summary:after{content:' ⌄';font-size:11px}.submenu{position:absolute;top:calc(100% + 10px);left:-8px;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px #0002;z-index:20}.nav-group:not([open]) .submenu{display:none}.submenu a{display:block;padding:9px;border-radius:6px;color:var(--gray)!important;font-size:14px;text-decoration:none}.submenu a:hover{background:var(--light);color:var(--blue)!important}main{max-width:900px;margin:40px auto;padding:0 20px 55px}.hero{text-align:center;padding:35px 20px;background:var(--light)}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.form{background:var(--pale);padding:28px;border:1px solid var(--line);border-radius:12px}.form input,.form textarea{width:100%;padding:11px;margin:6px 0 14px;border:1px solid var(--line);border-radius:7px;font:inherit}.form button{width:100%;padding:12px;border:0;border-radius:7px;background:var(--blue);color:white;font-weight:700}.footer{text-align:center;border-top:1px solid var(--line);padding:22px;color:var(--gray);font-size:13px}
    .menu-toggle{display:none;width:44px;height:44px;padding:10px;border:0;background:transparent;cursor:pointer;border-radius:8px;align-items:center;justify-content:center;flex-direction:column;gap:5px}
    .menu-toggle:hover{background:#E8F3FC}
    .menu-toggle span{display:block;width:22px;height:2px;background:#202124;border-radius:2px;transition:transform .2s,opacity .2s}
    .menu-toggle[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .menu-toggle[aria-expanded=true] span:nth-child(2){opacity:0}
    .menu-toggle[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    @media(max-width:860px){
      .menu-toggle{display:inline-flex}
      .header-inner{position:relative;min-height:64px;height:auto;padding:8px 0}
      .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:4px;padding:12px 16px 20px;background:#fff;border-bottom:1px solid #E8EAED;box-shadow:0 12px 28px rgba(0,0,0,.08);z-index:50}
      .nav.is-open{display:flex}
      .nav>a,.nav summary{display:block;padding:12px 10px;font-size:16px;border-radius:8px}
      .nav>a:hover,.nav summary:hover{background:#E8F3FC}
      .nav-group{width:100%}
      .nav-group .submenu{position:static;box-shadow:none;border:0;padding:0 0 0 12px;margin:0;min-width:0;background:transparent}
      .submenu a{padding:10px 12px}
      .contact-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="logo" href="index.html"><span class="mark">ET</span>EasyTag</a>
      <button type="button" class="menu-toggle" aria-label="Apri menu" aria-expanded="false" aria-controls="main-nav"><span></span><span></span><span></span></button>
      <nav id="main-nav" class="nav" aria-label="Navigazione principale"><a href="index.html">Home</a><a href="shop/index.html">Shop</a><details class="nav-group"><summary>Chi siamo</summary><div class="submenu"><a href="chi-siamo.html">Panoramica</a><a href="tag-nativo-google-ads.html">Tag nativo Google Ads</a><a href="tag-google-analytics-4.html">Google Analytics 4</a><a href="datalayer-architettura.html">Architettura DataLayer</a></div></details><a href="contatti.html" class="active">Contatti</a></nav></div></header>
  <section class="hero"><h1>Parliamone</h1><p>Scrivici per un progetto, un intervento tecnico o una collaborazione continuativa.</p></section>
  <main><div class="contact-grid"><div><h2>Informazioni</h2><p><strong>Email:</strong> support@easytag.com</p></div><div class="form"><form action="mailto:support@easytag.com" method="post" enctype="text/plain"><label>Nome e cognome</label><input type="text" name="nome" required><label>Email</label><input type="email" name="email" required><label>Messaggio</label><textarea name="messaggio" required rows="5"></textarea><button type="submit">Invia richiesta</button></form></div></div></main>
  <footer class="footer">© 2026 Easy Tag · <a href="chi-siamo.html">Chi siamo</a></footer>
<script>
(function(){
  var btn=document.querySelector('.menu-toggle');
  var nav=document.getElementById('main-nav');
  if(!btn||!nav) return;
  btn.addEventListener('click',function(){
    var open=nav.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Chiudi menu' : 'Apri menu');
  });
  nav.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click',function(){
      nav.classList.remove('is-open');
      btn.setAttribute('aria-expanded','false');
      btn.setAttribute('aria-label','Apri menu');
    });
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&nav.classList.contains('is-open')){
      nav.classList.remove('is-open');
      btn.setAttribute('aria-expanded','false');
      btn.setAttribute('aria-label','Apri menu');
      btn.focus();
    }
  });
})();
</script>
</body>
</html>
