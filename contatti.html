<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contatti | Easy Tag</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{--blue:#1182DE;--blue-dark:#0B5CAD;--light:#E8F3FC;--ink:#202124;--gray:#5F6368;--line:#E8EAED;--pale:#F8F9FA}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);line-height:1.65}.header{position:sticky;top:0;z-index:5;background:#fffffff5;border-bottom:1px solid var(--line);padding:0 20px}.header-inner{max-width:1120px;min-height:68px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:20px;font-weight:700;text-decoration:none;color:inherit}.mark{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:8px;border-radius:9px;background:var(--blue);color:white}.nav{display:flex;align-items:center;gap:18px}.nav>a{font-size:14px;font-weight:600;text-decoration:none;color:var(--gray)}.nav a:hover,.nav a.active{color:var(--blue)}main{max-width:900px;margin:40px auto;padding:0 20px 55px}.hero{text-align:center;padding:35px 20px;background:var(--light)}.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.form{background:var(--pale);padding:28px;border:1px solid var(--line);border-radius:12px}.form input,.form textarea{width:100%;padding:11px;margin:6px 0 14px;border:1px solid var(--line);border-radius:7px;font:inherit}.form button{width:100%;padding:12px;border:0;border-radius:7px;background:var(--blue);color:white;font-weight:700}.footer{text-align:center;border-top:1px solid var(--line);padding:22px;color:var(--gray);font-size:13px}@media(max-width:700px){.header-inner{flex-direction:column;align-items:flex-start;padding:10px 0}.nav{flex-wrap:wrap;gap:12px}.contact-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="logo" href="index.html"><span class="mark">ET</span>EasyTag</a><nav class="nav" aria-label="Navigazione principale"><a href="index.html">Home</a><a href="shop/index.html">Shop</a><a href="chi-siamo.html">Chi siamo</a><a href="contatti.html" class="active">Contatti</a></nav></div></header>
  <section class="hero"><h1>Parliamone</h1><p>Scrivici per un progetto, un intervento tecnico o una collaborazione continuativa.</p></section>
  <main><div class="contact-grid"><div><h2>Informazioni</h2><p><strong>Email:</strong> support@easytag.com</p></div><div class="form"><form><label>Nome e cognome</label><input type="text" required><label>Email</label><input type="email" required><label>Messaggio</label><textarea required rows="5"></textarea><button type="submit">Invia richiesta</button></form></div></div></main>
  <footer class="footer">© 2026 Easy Tag · <a href="chi-siamo.html">Chi siamo</a></footer>
</body>
</html>
